<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Party Invitation ✨</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    
    <!-- Confetti library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <!-- Garland -->
    <ul class="garland">
        <li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li>
        <li></li><li></li><li></li><li></li><li></li>
    </ul>

    <!-- Emoji rain container -->
    <div class="emoji-rain" id="emojiRain"></div>

    <div class="container">
        <h1 class="title">You're Invited!</h1>
        <p class="subtitle">Tap the envelope to open your invitation ✨</p>

        <!-- New Aesthetic Envelope Container -->
        <div class="envelope-wrapper" id="envelopeWrapper">
            <div class="envelope" id="envelope">
                <div class="front">
                    <!-- Wax seal with plant design -->
                    <div class="wax-seal">
                        <svg class="plant-icon" viewBox="0 0 100 100">
                            <path d="M50 10 C50 10, 60 40, 50 60 M50 30 C50 30, 30 40, 35 55 M50 45 C50 45, 70 50, 65 65 M50 60 C50 60, 45 80, 50 90" stroke="currentColor" stroke-width="3" fill="none"/>
                            <circle cx="35" cy="55" r="3" fill="currentColor"/>
                            <circle cx="65" cy="65" r="3" fill="currentColor"/>
                            <circle cx="50" cy="90" r="3" fill="currentColor"/>
                        </svg>
                    </div>
                </div>
            </div>
            <!-- Shadow under envelope -->
            <div class="envelope-shadow"></div>
        </div>
    </div>

    <!-- Modal for the full invitation image -->
    <div class="photo-modal" id="photoModal">
        <span class="close-modal" id="closeModal">&times;</span>
        <img src="invite.jpg" alt="Birthday Party Invitation" class="modal-img">
    </div>

    <script src="script.js"></script>
</body>
</html>
